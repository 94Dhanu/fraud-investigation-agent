services:
  postgres:
    image: postgres:16-alpine
    container_name: fraudagent-postgres
    environment:
      POSTGRES_DB: fraudagent
      POSTGRES_USER: fraudagent
      POSTGRES_PASSWORD: fraudagent
    ports:
      - "5432:5432"
    volumes:
      - fraudagent-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraudagent -d fraudagent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fraudagent-pgdata:
