fraud:
  seed-demo-data: false
  agent:
    mode: rules
    risk-thresholds:
      deny-below: 35
      escalate-at-or-above: 70
  rag:
    top-k: 4

spring:
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
  datasource:
    url: jdbc:h2:mem:fraudagent-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
