<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: head('Review Queue — Fraud Agent')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div th:replace="~{fragments/nav :: alerts}"></div>

<div class="container-fluid px-4">
    <h2 class="mb-3">Human Review Queue</h2>
    <p class="text-muted">Every agent recommendation is advisory — POL-515 requires a
        recorded human decision before a case can resolve.</p>

    <div class="card">
        <div class="table-responsive">
            <table class="table table-hover mb-0 align-middle">
                <thead><tr>
                    <th>ID</th><th>Transaction</th><th>Amount</th><th>Merchant</th>
                    <th>Reason</th><th>Waiting since</th><th></th>
                </tr></thead>
                <tbody>
                <tr th:each="c : ${queue}">
                    <td th:text="${c.id}"></td>
                    <td class="font-monospace" th:text="${c.transactionId}"></td>
                    <td th:text="${@fmt.money(c.amount, c.currency)}"></td>
                    <td th:text="${c.merchantId}"></td>
                    <td th:text="${@fmt.enumLabel(c.disputeReason)}"></td>
                    <td th:text="${@fmt.instant(c.updatedAt)}"></td>
                    <td><a class="btn btn-sm btn-warning" th:href="@{/cases/{id}(id=${c.id})}">Review</a></td>
                </tr>
                <tr th:if="${#lists.isEmpty(queue)}">
                    <td colspan="7" class="text-center text-muted py-4">Queue is empty — all caught up.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
<script th:replace="~{fragments/nav :: scripts}"></script>
</body>
</html>
