<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/nav :: head('New Dispute — Fraud Agent')}"></head>
<body>
<nav th:replace="~{fragments/nav :: nav}"></nav>
<div th:replace="~{fragments/nav :: alerts}"></div>

<div class="container" style="max-width: 900px;">
    <h2 class="mb-3">New Dispute Intake</h2>

    <div th:if="${errors}" class="alert alert-danger">
        <strong>Validation failed:</strong>
        <ul class="mb-0"><li th:each="e : ${errors}" th:text="${e}"></li></ul>
    </div>

    <div class="card"><div class="card-body">
        <form method="post" action="/cases" th:object="${form}">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Transaction ID *</label>
                    <input class="form-control" th:field="*{transactionId}" placeholder="TXN-88412" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Card Fingerprint *</label>
                    <input class="form-control" th:field="*{cardFingerprint}" placeholder="card_fp_9f31c2" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Account ID *</label>
                    <input class="form-control" th:field="*{accountId}" placeholder="ACC-100234" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Merchant ID *</label>
                    <input class="form-control" th:field="*{merchantId}" placeholder="MERCH-5521" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Merchant Category *</label>
                    <input class="form-control" th:field="*{merchantCategory}" placeholder="ELECTRONICS" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Amount *</label>
                    <input class="form-control" type="number" step="0.01" min="0.01" th:field="*{amount}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Currency *</label>
                    <input class="form-control" maxlength="3" th:field="*{currency}" placeholder="USD" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Occurred At (UTC) *</label>
                    <input class="form-control" type="datetime-local" th:field="*{occurredAt}" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Customer Country *</label>
                    <input class="form-control" maxlength="2" th:field="*{customerCountry}" placeholder="US" required>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Merchant Country *</label>
                    <input class="form-control" maxlength="2" th:field="*{merchantCountry}" placeholder="US" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Channel *</label>
                    <select class="form-select" th:field="*{channel}" required>
                        <option value="">—</option>
                        <option th:each="ch : ${channels}" th:value="${ch}" th:text="${ch}"></option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Dispute Reason *</label>
                    <select class="form-select" th:field="*{disputeReason}" required>
                        <option value="">—</option>
                        <option th:each="r : ${disputeReasons}" th:value="${r.name()}"
                                th:text="${@fmt.enumLabel(r)}"></option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Customer Narrative</label>
                    <textarea class="form-control" rows="3" th:field="*{customerNarrative}"
                              placeholder="Customer statement: 'I did not make this purchase…'"></textarea>
                </div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-primary">Submit &amp; Investigate</button>
                <a class="btn btn-outline-secondary" href="/cases">Cancel</a>
            </div>
            <div class="form-text mt-2">
                On submit the six deterministic evidence tools run, the agent (or rules
                engine) produces a cited risk recommendation, and the case enters the
                human review queue.
            </div>
        </form>
    </div></div>
</div>
<script th:replace="~{fragments/nav :: scripts}"></script>
</body>
</html>
